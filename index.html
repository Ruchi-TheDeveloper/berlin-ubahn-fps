<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Berlin U-Bahn FPS</title>

<style>
body { margin:0; overflow:hidden; }
#instructions{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
background:rgba(0,0,0,0.7);
padding:20px;
cursor:pointer;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

<div id="instructions">
Click to Start<br>
W A S D = Move | Mouse = Look
</div>

<script>

let camera, scene, renderer, controls;

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight,0.1,1000);
camera.position.y = 1.6;

renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

controls = new THREE.PointerLockControls(camera, document.body);

document.getElementById("instructions").onclick = () => controls.lock();

scene.add(controls.getObject());

const light = new THREE.HemisphereLight(0xffffff,0x444444);
scene.add(light);

const loader = new THREE.GLTFLoader();

loader.load("./models/berlin_u-bahn_station-DCiGf8w9.glb", (gltf)=>{
scene.add(gltf.scene);
});

function animate(){
requestAnimationFrame(animate);
renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
